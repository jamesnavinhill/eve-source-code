name: Sync upstream

# Syncs this fork with vercel/eve main, 4x daily.
# Rebases the fork's main onto upstream/main and force-pushes.
# The only custom commit on this fork is this workflow file itself.

on:
  schedule:
    # 4x daily: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/vercel/eve.git || true
          git fetch upstream main

      - name: Check for changes
        id: check
        run: |
          if [ -z "$(git log --oneline HEAD..upstream/main)" ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "New upstream commits:"
            git log --oneline HEAD..upstream/main
          fi

      - name: Rebase onto upstream
        if: steps.check.outputs.changes == 'true'
        run: |
          git rebase upstream/main

      - name: Push
        if: steps.check.outputs.changes == 'true'
        run: |
          git push origin main --force-with-lease
